# Serves the Hypothesis client:
#
#   /hypothesis                          boot script of the version in this image
#                                        (stable URL for h's CLIENT_URL)
#   /hypothesis/<version>/build/...      boot script, bundles, styles and fonts
#
# Assets get `Access-Control-Allow-Origin: *` because the annotator loads fonts
# and stylesheets cross-origin from pages on other domains.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Revalidated on every load (ETag), so a new image takes effect right away
    # and browsers never ask for an asset version that is no longer served.
    location = /hypothesis {
        alias /usr/share/nginx/html/hypothesis/current/build/boot.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # The boot script is rendered at container start, so it is not immutable.
    location ~ ^/hypothesis/[^/]+/build/boot\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Versioned assets never change. No `always`, so that 404s are not cached.
    location /hypothesis/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        return 404;
    }
}
